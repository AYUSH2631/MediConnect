spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:9090
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Sample route so you can see it in Admin UI
      routes:
        - id: auth-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/auth/**

  application:
    name: gateway-service

  boot:
    admin:
      client:
        enabled: true
        url: http://localhost:8081                # Admin server URL
        instance:
          name: Gateway Service
          service-url: http://localhost:8080      # Gateway base URL
          management-url: http://localhost:8080/actuator
          health-url: http://localhost:8080/actuator/health
          auto-registration: true

  main:
    web-application-type: reactive

  logging:
    level:
      org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS0yNThbrurgnwrgjnjngnfndmfddY=}
