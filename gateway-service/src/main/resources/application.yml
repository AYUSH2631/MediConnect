spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:9090
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Sample route so you can see it in Admin UI
      routes:
        - id: sample-route
          uri: https://httpbin.org
          predicates:
            - Path=/test/**

  application:
    name: gateway-service

  boot:
    admin:
      client:
        enabled: true
        url: http://localhost:8080                  # Admin server URL
        instance:
          name: Gateway Service
          service-url: http://localhost:8081       # Gateway base URL
          management-url: http://localhost:8081/actuator
          health-url: http://localhost:8081/actuator/health
          auto-registration: true

  main:
    web-application-type: reactive

  logging:
    level:
      org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:my-very-strong-jwt-secret-key-256-bit-long!!}
