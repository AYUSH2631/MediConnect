spring:
  application:
    name: doctor-service

  boot:
    admin:
      client:
        enabled: true
        instance:
          name: Doctor Service
          service-url: http://localhost:8083
        url: http://localhost:8081
        auto-registration: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/doctordb

logging:
  level:
    org:
      springframework:
        web: DEBUG
        servlet: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
      enable:
        include: health

server:
  port: 8083
